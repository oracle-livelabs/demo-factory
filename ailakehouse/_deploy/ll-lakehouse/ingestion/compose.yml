        condition: service_healthy
      ords:
        condition: service_healthy
      ollama:
        condition: service_healthy
      privateai:
        condition: service_healthy
      netsuite-db:
        condition: service_healthy
      goldengate-cdc:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3001/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 180s
    restart: unless-stopped
